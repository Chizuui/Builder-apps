# ==========================================================================
# PUT THIS FILE IN THE Builder-apps REPO AT:
#   .github/workflows/build-opennow-windows.yml
#
# It builds OpenNOW (Chizuui/OpenNOW-Modified) from source on a stock
# GitHub-hosted Windows runner and publishes the Windows installer
# (MSI + portable ZIP + setup.exe) as a Release in the Builder-apps repo.
#
# Secrets:
#   - If OpenNOW-Modified is PUBLIC: nothing needed.
#   - If it is PRIVATE: add repo secret SOURCE_REPO_TOKEN = a PAT with
#     read access to the source repo; checkout picks it up automatically.
#
# Run it from the Builder-apps "Actions" tab -> "Build OpenNOW (Windows)".
# ==========================================================================
name: Build OpenNOW (Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenNOW branch/tag/SHA to build"
        type: string
        default: dev
      version:
        description: "Version major.minor.patch (e.g. 1.0.3)"
        type: string
        default: "1.0.3"

permissions:
  contents: write   # needed to create a Release in this (Builder-apps) repo

env:
  SOURCE_REPO: Chizuui/OpenNOW-Modified
  SDL_VERSION: release-3.2.20
  QT_VERSION: "6.8.3"
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout OpenNOW source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: "Map source to O: (short build path)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path O:\) { throw "O: is already in use" }
          subst O: "$env:GITHUB_WORKSPACE\source"
          if (-not (Test-Path O:\opennow-qt\CMakeLists.txt)) { throw "Could not map source to O:" }

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            source/native/opennow-core -> target
            source/native/opennow-streamer -> target
            source/native/opennow-core -> ../../build/opennow-qt-release/rust-target
            source/native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            source/native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Install LLVM (libclang for Rust bindgen)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) { throw "LLVM missing libclang.dll" }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WiX Toolset v3.14 (MSI generator)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          $wixBin = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14/bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) { throw "WiX missing candle.exe" }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: qt-win-x64

      - name: Build and cache SDL3
        uses: ./source/.github/actions/sdl3
        with:
          version: ${{ env.SDL_VERSION }}
          target-arch: x64
          parallel: 4

      - name: Bound Rust jobs and pin MSVC linker
        shell: pwsh
        run: |
          "CARGO_BUILD_JOBS=4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "MSVC x64 linker not found" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Release)
        shell: bash
        run: |
          cd /o
          cmake -S opennow-qt -B build/opennow-qt-release \
            -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENNOW_BUILD_VERSION="${{ inputs.version }}" \
            -DOPENNOW_UPDATE_ED25519_PUBLIC_KEY="" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install"

      - name: Build
        shell: bash
        run: |
          cd /o
          cmake --build build/opennow-qt-release --config Release --parallel 4

      - name: Package MSI + portable ZIP
        shell: bash
        run: |
          cd /o
          mkdir -p build/qt-packages
          cpack --config build/opennow-qt-release/CPackConfig.cmake \
            -C Release -G "WIX;ZIP" -B build/qt-packages

      - name: Build setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = "source/build/qt-packages"
          $zip = @(Get-ChildItem $pkgDir -Filter *.zip)
          if ($zip.Count -ne 1) { throw "Expected one portable ZIP" }
          $payload = Join-Path $env:RUNNER_TEMP "setup-payload"
          if (Test-Path $payload) { Remove-Item $payload -Recurse -Force }
          Expand-Archive $zip[0].FullName $payload
          $setup = Join-Path (Resolve-Path $pkgDir) ([IO.Path]::GetFileNameWithoutExtension($zip[0].Name) + "-setup.exe")
          ./source/opennow-qt/packaging/windows/build-setup.ps1 -Payload $payload -Version "${{ inputs.version }}" -Arch x64 -OutputFile $setup

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-r${{ github.run_number }}
          name: OpenNOW ${{ inputs.version }} (${{ inputs.ref }})
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            source/build/qt-packages/*.msi
            source/build/qt-packages/*.zip
            source/build/qt-packages/*-setup.exe
